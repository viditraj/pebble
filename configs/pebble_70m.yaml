# Pebble-70M Training Configuration
# Target: NVIDIA L4 (23GB VRAM), 5-hour compute budget
# Architecture: ~88M params (LLaMA-style)

model:
  vocab_size: 16384
  d_model: 768
  n_layers: 12
  n_heads: 12
  n_kv_heads: 4
  d_ff: 2048
  max_seq_len: 1024
  dropout: 0.0

training:
  # Batch sizes — L4 has 23GB
  # batch=8 uses ~13GB VRAM, safe for L4
  micro_batch_size: 8          # sequences per forward pass
  gradient_accumulation_steps: 8  # effective batch = 8 * 8 = 64

  # Learning rate
  max_lr: 3.0e-4
  min_lr: 3.0e-5
  warmup_steps: 500

  # Training duration — fit within 5 hours on L4
  # At ~0.5s/step with batch=16: ~36K steps in 5 hours
  # Tokens seen: 36000 * 64 * 1024 = ~2.4B tokens
  total_steps: 30000

  # Regularization
  weight_decay: 0.1
  grad_clip: 1.0

  # Precision
  precision: bf16

  # Checkpointing & logging
  save_every: 5000
  eval_every: 500
  log_every: 10

data:
  train_path: data/processed/train_70m.bin
  val_path: data/processed/val_70m.bin
  seq_len: 1024

sft:
  learning_rate: 2.0e-5
  micro_batch_size: 8
  gradient_accumulation_steps: 4
  warmup_steps: 100
  total_steps: 3000
  weight_decay: 0.01
  grad_clip: 1.0
  save_every: 500
  eval_every: 200
  log_every: 10
