# Pebble-25M Training Configuration

model:
  vocab_size: 16384
  d_model: 512
  n_layers: 8
  n_heads: 8
  n_kv_heads: 4
  d_ff: 1376
  max_seq_len: 1024
  dropout: 0.0

training:
  # Batch sizes
  micro_batch_size: 8        # sequences per GPU forward pass
  gradient_accumulation_steps: 4  # effective batch = 8 × 4 = 32
  
  # Learning rate
  max_lr: 3.0e-4
  min_lr: 3.0e-5
  warmup_steps: 1000
  
  # Training duration
  total_steps: 50000         # ~1.6B tokens seen (32 × 1024 × 50000)
  
  # Regularization
  weight_decay: 0.1
  grad_clip: 1.0
  
  # Precision
  precision: bf16
  
  # Checkpointing & logging
  save_every: 5000
  eval_every: 500
  log_every: 10

data:
  train_path: data/processed/train.bin
  val_path: data/processed/val.bin
  seq_len: 1024

sft:
  learning_rate: 2.0e-5
  micro_batch_size: 4
  gradient_accumulation_steps: 4
  warmup_steps: 100
  total_steps: 3000
  weight_decay: 0.01
  grad_clip: 1.0
  save_every: 500
  eval_every: 200
  log_every: 10