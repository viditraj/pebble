<svg viewBox="0 0 860 760" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <linearGradient id="blockGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="860" height="760" fill="#0d1117"/>

  <!-- Title -->
  <text x="430" y="34" text-anchor="middle" fill="#e6edf3" font-size="18" font-weight="700">Pebble-25M &#183; LLaMA-style Decoder</text>
  <text x="430" y="54" text-anchor="middle" fill="#8b949e" font-size="12">8 &#215; Transformer Blocks, RoPE, GQA, SwiGLU, RMSNorm</text>

  <!-- Input tokens -->
  <rect x="330" y="76" width="200" height="40" rx="8" fill="#21262d" stroke="#30363d"/>
  <text x="430" y="101" text-anchor="middle" fill="#c9d1d9" font-size="13">Input Token IDs</text>
  <line x1="430" y1="116" x2="430" y2="140" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Embedding -->
  <rect x="290" y="140" width="280" height="42" rx="8" fill="#132a1a" stroke="#2ea043"/>
  <text x="430" y="166" text-anchor="middle" fill="#7ee787" font-size="13" font-weight="600">Token Embedding</text>
  <line x1="430" y1="182" x2="430" y2="206" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- weight tying side path -->
  <path d="M 570 161 C 700 161, 740 161, 740 200 L 740 560 C 740 610, 700 630, 590 645" fill="none" stroke="#484f58" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="750" y="400" fill="#6e7681" font-size="11" transform="rotate(90 750,400)" text-anchor="middle">weight tying</text>

  <!-- Transformer block outer box -->
  <rect x="150" y="206" width="560" height="404" rx="14" fill="url(#blockGrad)" stroke="#30363d" stroke-width="1.5"/>
  <text x="430" y="232" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="700">Transformer Block &#215; 8</text>

  <!-- RMSNorm 1 -->
  <rect x="290" y="250" width="280" height="36" rx="8" fill="#21262d" stroke="#484f58"/>
  <text x="430" y="273" text-anchor="middle" fill="#c9d1d9" font-size="12">RMSNorm</text>
  <line x1="430" y1="286" x2="430" y2="304" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- GQA Attention -->
  <rect x="250" y="304" width="360" height="66" rx="8" fill="#0d2137" stroke="#1f6feb"/>
  <text x="430" y="330" text-anchor="middle" fill="#79c0ff" font-size="13" font-weight="600">GQA Attention + RoPE</text>
  <text x="430" y="350" text-anchor="middle" fill="#8b949e" font-size="11">8 query heads &#183; 4 KV heads &#183; head_dim = 64</text>
  <line x1="430" y1="370" x2="430" y2="392" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- residual 1 arc -->
  <path d="M 300 268 C 190 268, 190 400, 300 400" fill="none" stroke="#6e7681" stroke-width="1.5" stroke-dasharray="4,4"/>
  <path d="M 300 400 L 320 400" stroke="#6e7681" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Add 1 -->
  <circle cx="430" cy="400" r="14" fill="#21262d" stroke="#6e7681"/>
  <text x="430" y="405" text-anchor="middle" fill="#c9d1d9" font-size="14">+</text>
  <line x1="430" y1="414" x2="430" y2="432" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- RMSNorm 2 -->
  <rect x="290" y="432" width="280" height="36" rx="8" fill="#21262d" stroke="#484f58"/>
  <text x="430" y="455" text-anchor="middle" fill="#c9d1d9" font-size="12">RMSNorm</text>
  <line x1="430" y1="468" x2="430" y2="486" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- SwiGLU FFN -->
  <rect x="250" y="486" width="360" height="60" rx="8" fill="#2b1d33" stroke="#a371f7"/>
  <text x="430" y="512" text-anchor="middle" fill="#d2a8ff" font-size="13" font-weight="600">SwiGLU FFN</text>
  <text x="430" y="530" text-anchor="middle" fill="#8b949e" font-size="11">d_ff = 1376</text>
  <line x1="430" y1="546" x2="430" y2="566" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- residual 2 arc -->
  <path d="M 300 450 C 190 450, 190 578, 300 578" fill="none" stroke="#6e7681" stroke-width="1.5" stroke-dasharray="4,4"/>
  <path d="M 300 578 L 320 578" stroke="#6e7681" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Add 2 -->
  <circle cx="430" cy="578" r="14" fill="#21262d" stroke="#6e7681"/>
  <text x="430" y="583" text-anchor="middle" fill="#c9d1d9" font-size="14">+</text>

  <text x="590" y="598" fill="#6e7681" font-size="11" text-anchor="end">&#215; 8 layers, stacked</text>

  <line x1="430" y1="610" x2="430" y2="634" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Final RMSNorm -->
  <rect x="290" y="634" width="280" height="38" rx="8" fill="#21262d" stroke="#484f58"/>
  <text x="430" y="658" text-anchor="middle" fill="#c9d1d9" font-size="12">Final RMSNorm</text>
  <line x1="430" y1="672" x2="430" y2="692" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- LM head -->
  <rect x="290" y="692" width="280" height="40" rx="8" fill="#132a1a" stroke="#2ea043"/>
  <text x="430" y="717" text-anchor="middle" fill="#7ee787" font-size="13" font-weight="600">Linear Head (tied weights)</text>

  <text x="430" y="750" text-anchor="middle" fill="#8b949e" font-size="12">Output Logits &#8594; vocab_size (16,384)</text>
</svg>
