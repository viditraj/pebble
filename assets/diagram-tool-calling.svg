<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="460" fill="#0d1117"/>
  <text x="450" y="32" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="700">How Tool Calling Works</text>

  <!-- User message -->
  <rect x="20" y="70" width="170" height="50" rx="8" fill="#0d2137" stroke="#1f6feb"/>
  <text x="105" y="99" text-anchor="middle" fill="#79c0ff" font-size="12" font-weight="600">User message</text>
  <line x1="190" y1="95" x2="290" y2="95" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- Tool results feedback -->
  <line x1="290" y1="230" x2="190" y2="230" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <rect x="20" y="205" width="170" height="50" rx="8" fill="#132a1a" stroke="#2ea043"/>
  <text x="105" y="234" text-anchor="middle" fill="#7ee787" font-size="12" font-weight="600">Tool results</text>

  <!-- Pebble model box -->
  <rect x="290" y="70" width="220" height="190" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="400" y="170" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="700">Pebble Model</text>
  <text x="400" y="192" text-anchor="middle" fill="#6e7681" font-size="11">generates tokens</text>

  <line x1="510" y1="130" x2="580" y2="130" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="510" y1="200" x2="580" y2="200" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="545" y="122" text-anchor="middle" fill="#6e7681" font-size="10">regular text</text>
  <text x="545" y="220" text-anchor="middle" fill="#6e7681" font-size="10">&lt;|tool_call|&gt;</text>

  <!-- Print to user -->
  <rect x="580" y="105" width="160" height="50" rx="8" fill="#21262d" stroke="#484f58"/>
  <text x="660" y="134" text-anchor="middle" fill="#c9d1d9" font-size="12" font-weight="600">Print to user</text>

  <!-- Tool executor box -->
  <rect x="580" y="175" width="180" height="70" rx="8" fill="#2b1d33" stroke="#a371f7"/>
  <text x="670" y="200" text-anchor="middle" fill="#d2a8ff" font-size="12" font-weight="600">Tool Executor</text>
  <text x="670" y="218" text-anchor="middle" fill="#8b949e" font-size="10">parse function</text>
  <text x="670" y="232" text-anchor="middle" fill="#8b949e" font-size="10">+ arguments</text>

  <line x1="670" y1="245" x2="670" y2="275" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- Execute function -->
  <rect x="580" y="275" width="180" height="46" rx="8" fill="#21262d" stroke="#484f58"/>
  <text x="670" y="303" text-anchor="middle" fill="#c9d1d9" font-size="12">Execute function</text>

  <line x1="670" y1="321" x2="670" y2="351" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- Format result -->
  <rect x="580" y="351" width="180" height="46" rx="8" fill="#132a1a" stroke="#2ea043"/>
  <text x="670" y="379" text-anchor="middle" fill="#7ee787" font-size="12">Format &lt;|result|&gt;</text>

  <!-- feed back arc -->
  <path d="M 580 374 C 350 400, 200 340, 105 255" fill="none" stroke="#6e7681" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow2)"/>
  <text x="330" y="420" text-anchor="middle" fill="#6e7681" font-size="11">feed back into the model, generation resumes</text>
</svg>
